<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bufferclick - Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app"></div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getDatabase, ref, onValue, push, update, remove, set } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js';

        const firebaseConfig = {
            databaseURL: 'https://bufferclicks-default-rtdb.europe-west1.firebasedatabase.app/'
        };

        const app = initializeApp(firebaseConfig);
        window.db = getDatabase(app);
        window.dbRef = ref;
        window.dbOnValue = onValue;
        window.dbPush = push;
        window.dbUpdate = update;
        window.dbRemove = remove;
        window.dbSet = set;

        // Initialize app after Firebase is ready
        const script = document.createElement('script');
        script.src = 'main.js';
        script.type = 'module';
        document.body.appendChild(script);
    </script>
</body>
</html>
